<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f3"><title>Pengvintory/title><style>
:root{--ink:#202019;--muted:#79786f;--line:#e3e0d8;--paper:#f8f7f3;--accent:#d6ff46;--orange:#fa5d38}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:76px;padding:0 max(24px,calc((100vw - 1280px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbfaf7}.brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;font-weight:800}.mark{display:grid;place-items:center;width:24px;height:24px;background:var(--ink);color:var(--accent);font-family:Georgia,serif;font-size:17px;letter-spacing:0}.header-actions{display:flex;align-items:center;gap:8px}.icon-button,.avatar,.more,.drawer-close{border:0;background:transparent;color:var(--ink)}.icon-button{width:38px;height:38px;display:grid;place-items:center}.avatar{background:#ddded5;border-radius:100%;font-size:10px;font-weight:700;width:32px;height:32px}.intro,.controls,.collection{max-width:1280px;margin:0 auto;padding-left:24px;padding-right:24px}.intro{padding-top:72px;padding-bottom:54px;display:flex;justify-content:space-between;align-items:end}.eyebrow{color:var(--orange);letter-spacing:.15em;font-size:10px;font-weight:800;margin:0 0 18px}.intro h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,88px);line-height:.91;letter-spacing:-.065em;font-weight:400;margin:0}.intro h1 em{color:var(--orange);font-weight:400}.intro-copy{color:var(--muted);font-size:16px;margin:24px 0 0}.actions{display:flex;gap:10px}.add-button,.save-button{display:flex;align-items:center;gap:10px;border:0;background:var(--ink);color:#fff;padding:14px 20px;font-size:13px;font-weight:700;border-radius:2px}.backup-button{border:1px solid var(--line);background:transparent;padding:13px 15px;font-size:12px;font-weight:700;color:var(--ink)}.controls{display:flex;gap:12px;padding-bottom:31px;border-bottom:1px solid var(--line)}.search{height:45px;flex:1;max-width:416px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);background:#fff;color:var(--muted)}.search input{border:0;outline:0;width:100%;font-size:13px;background:transparent;color:var(--ink)}.filter{padding:0 14px;border:1px solid var(--line);background:transparent;font-size:12px;color:var(--ink)}.filter span{color:var(--muted)}.collection{padding-top:31px;padding-bottom:80px}.collection-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.collection-header h2{font-family:Georgia,serif;font-size:23px;font-weight:400;margin:0}.collection-header button{display:flex;align-items:center;gap:3px;border:0;background:transparent;color:var(--orange);font-size:12px;font-weight:700}.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item-card{background:#fff;cursor:pointer;transition:transform .2s ease}.item-card:hover{transform:translateY(-3px)}.photo-wrap{position:relative;aspect-ratio:1.15;overflow:hidden;background:#e9e6dd}.photo-wrap img{width:100%;height:100%;object-fit:cover}.more{position:absolute;right:7px;top:7px;width:32px;height:32px;background:#fffc;border-radius:50%;display:grid;place-items:center}.item-detail{padding:15px 14px 16px;display:flex;justify-content:space-between;gap:10px}.item-detail h3{font-size:14px;margin:0 0 5px}.item-detail p,.item-detail span{margin:0;color:var(--muted);font-size:11px}.item-detail span{text-align:right}.empty{padding:70px 0;text-align:center;color:var(--muted)}.mobile-add{display:none}.overlay{position:fixed;inset:0;background:#1b1b18aa;z-index:10;display:flex;justify-content:flex-end}.drawer{width:min(490px,100%);height:100%;overflow:auto;background:#fcfbf8;padding:58px 38px 36px;position:relative;box-shadow:-15px 0 40px #0002}.drawer-close{position:absolute;right:22px;top:20px;width:38px;height:38px;display:grid;place-items:center}.drawer h2{font-family:Georgia,serif;font-size:38px;line-height:1;margin:0 0 10px;font-weight:400}.drawer-image{width:100%;height:245px;object-fit:cover;margin:0 0 28px}.drawer-location{color:var(--muted);margin:0 0 27px}.detail-list{border-top:1px solid var(--line);margin-bottom:25px}.detail-list div{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}.detail-list span{color:var(--muted)}.outline-button{width:100%;padding:14px;background:transparent;border:1px solid var(--ink);font-weight:700;font-size:13px}.photo-upload{border:1px dashed #bdbab0;background:#f2f0e9;width:100%;height:160px;margin:7px 0 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:12px}.photo-upload.has-photo{padding:0;border-style:solid;overflow:hidden}.photo-upload img{width:100%;height:100%;object-fit:cover}.hidden-input{display:none}form>label,.form-row label{display:block;font-size:11px;font-weight:700;margin:0 0 16px}.drawer input{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 0 8px;outline:0;font-size:14px;color:var(--ink)}.drawer input:focus{border-color:var(--orange)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field-heading{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;margin:5px 0 7px}.field-heading button{color:var(--orange);border:0;background:transparent;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700}.custom-field{display:grid;grid-template-columns:1fr 1.2fr 19px;gap:10px;align-items:center;margin-bottom:12px}.custom-field button{border:0;background:transparent;color:var(--orange);font-size:20px;line-height:1;padding:0}.save-button{width:100%;justify-content:center;margin-top:26px}@media(max-width:680px){.topbar{height:64px;padding:0 18px}.intro,.controls,.collection{padding-left:18px;padding-right:18px}.intro{padding-top:49px;padding-bottom:35px;align-items:start}.intro h1{font-size:54px}.intro-copy{font-size:14px;margin-top:18px}.actions{display:none}.controls{padding-bottom:22px}.filter{display:none}.search{max-width:none}.collection{padding-top:25px}.inventory-grid{grid-template-columns:repeat(2,1fr);gap:10px}.photo-wrap{aspect-ratio:.9}.item-detail{padding:11px 10px 13px;display:block}.item-detail span{display:none}.item-detail h3{font-size:13px}.mobile-add{display:grid;place-items:center;position:fixed;z-index:5;right:20px;bottom:21px;width:54px;height:54px;border:0;border-radius:50%;background:var(--accent);color:var(--ink);box-shadow:0 8px 20px #0004}.drawer{padding:63px 24px 30px}.drawer h2{font-size:33px}.drawer-image{height:220px}.form-row{gap:12px}}
</style></head><body><header class="topbar"><div class="brand"><span class="mark">P</span><span>PENGVINTORY</span></div><div class="header-actions"><button class="icon-button" id="export" title="Download backup">↓</button><button class="icon-button" id="import" title="Restore backup">↑</button><button class="avatar">TA</button></div></header><section class="intro"><div><p class="eyebrow">YOUR COLLECTION</p><h1>Pengvintory,<br><em>Penguin Database.</em></h1><p class="intro-copy">A considered home for the things you own.</p></div><div class="actions"><button class="backup-button" id="backup">Backup / import</button><button class="add-button" id="add">＋ <span>Add item</span></button></div></section><section class="controls"><label class="search">⌕<input id="search" placeholder="Search your Pengvintory"></label><button class="filter">All items <span id="count"></span></button></section><section class="collection"><div class="collection-header"><h2>Recently added</h2><button>View all ›</button></div><div class="inventory-grid" id="grid"></div><div class="empty" id="empty" hidden>Your Pengvintory is empty — add your first item.</div></section><button class="mobile-add" id="mobile-add">＋</button><input id="file" class="hidden-input" type="file" accept="image/*" capture="environment"><input id="restore" class="hidden-input" type="file" accept="application/json,.json"><script>
let items=JSON.parse(localStorage.getItem('pengvintory-items')||'[]'),active=null,draft=null;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function save(){localStorage.setItem('pengvintory-items',JSON.stringify(items));render()}function render(){let q=$('#search').value.toLowerCase(),shown=items.filter(i=>(i.name+i.category+i.location).toLowerCase().includes(q));$('#count').textContent='('+items.length+')';$('#grid').innerHTML=shown.map(i=>`<article class="item-card" data-id="${i.id}"><div class="photo-wrap"><img src="${i.photo}" alt="${esc(i.name)}"><button class="more">•••</button></div><div class="item-detail"><div><h3>${esc(i.name)}</h3><p>${esc(i.category)}</p></div><span>${esc(i.location)}</span></div></article>`).join('');$('#empty').hidden=shown.length>0;document.querySelectorAll('.item-card').forEach(e=>e.onclick=()=>openItem(items.find(i=>i.id==e.dataset.id)))}function close(){document.querySelector('.overlay')?.remove();active=null;draft=null}function openItem(item){active=item;document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><aside class="drawer"><button class="drawer-close">×</button><img class="drawer-image" src="${item.photo}" alt="${esc(item.name)}"><p class="eyebrow">${esc(item.category)}</p><h2>${esc(item.name)}</h2><p class="drawer-location">${esc(item.location)}</p><div class="detail-list">${item.fields.map(f=>`<div><span>${esc(f.label)}</span><strong>${esc(f.value)}</strong></div>`).join('')}</div><button class="outline-button" id="edit">Edit item</button></aside></div>`);bindClose();$('#edit').onclick=()=>{close();openForm({...item,fields:item.fields.map(f=>({...f}))})}}function bindClose(){document.querySelector('.overlay').onclick=e=>{if(e.target.className==='overlay')close()};$('.drawer-close').onclick=close}function openForm(item={name:'',category:'',location:'',photo:'',fields:[{label:'Condition',value:''}]}){draft=item;let fields=item.fields.map((f,n)=>`<div class="custom-field"><input class="field-label" value="${esc(f.label)}" placeholder="Field name"><input class="field-value" value="${esc(f.value)}" placeholder="Value">${item.fields.length>1?'<button type="button" class="remove-field">×</button>':''}</div>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="overlay"><aside class="drawer"><button class="drawer-close">×</button><form id="form"><p class="eyebrow">${item.id?'EDIT ITEM':'NEW ITEM'}</p><h2>${item.id?'Edit your item':'Add to your Pengvintory'}</h2><button type="button" class="photo-upload ${item.photo?'has-photo':''}" id="photo">${item.photo?`<img src="${item.photo}">`:'⌾<span>Take or add a photo</span>'}</button><label>Item name<input id="name" required value="${esc(item.name)}" placeholder="e.g. Vintage record player"></label><div class="form-row"><label>Category<input id="category" value="${esc(item.category)}" placeholder="Optional"></label><label>Location<input id="location" value="${esc(item.location)}" placeholder="Optional"></label></div><div class="field-heading"><span>Additional details</span><button type="button" id="add-field">＋ Add field</button></div><div id="fields">${fields}</div><button class="save-button">Save item</button></form></aside></div>`);bindClose();$('#photo').onclick=()=>$('#file').click();$('#add-field').onclick=()=>{$('#fields').insertAdjacentHTML('beforeend','<div class="custom-field"><input class="field-label" placeholder="Field name"><input class="field-value" placeholder="Value"><button type="button" class="remove-field">×</button></div>');bindRemovers()};bindRemovers();$('#form').onsubmit=e=>{e.preventDefault();let data={...draft,id:draft.id||Date.now(),name:$('#name').value.trim(),category:$('#category').value||'Uncategorised',location:$('#location').value||'No location',fields:[...document.querySelectorAll('.custom-field')].map(x=>({label:x.querySelector('.field-label').value,value:x.querySelector('.field-value').value})).filter(f=>f.label&&f.value)};if(!data.name)return;if(data.id&&items.some(x=>x.id===data.id))items=items.map(x=>x.id===data.id?data:x);else items.unshift(data);save();close();openItem(data)}}function bindRemovers(){document.querySelectorAll('.remove-field').forEach(x=>x.onclick=()=>x.parentElement.remove())}$('#file').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>{draft.photo=r.result;$('.photo-upload').className='photo-upload has-photo';$('.photo-upload').innerHTML=`<img src="${r.result}">`};r.readAsDataURL(f)}};function exportBackup(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pengvintory-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}$('#restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let data=JSON.parse(r.result),restored=Array.isArray(data)?data:data.items;if(!Array.isArray(restored))throw 0;if(confirm(`Replace your current ${items.length} items with ${restored.length} items from this backup?`)){items=restored;save()}}catch{alert('That file is not a valid Pengvintory backup.')}};r.readAsText(f)};$('#add').onclick=()=>openForm();$('#mobile-add').onclick=()=>openForm();$('#search').oninput=render;$('#export').onclick=exportBackup;$('#import').onclick=()=>$('#restore').click();$('#backup').onclick=()=>{if(confirm('Download a backup now? Press Cancel to choose a backup file to restore.'))exportBackup();else $('#restore').click()};render();
</script></body></html>
